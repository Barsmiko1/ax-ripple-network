name: Bootstrap Infrastructure

# =============================================================================
# ONE-TIME workflow to bootstrap the infrastructure.
# After this runs, Atlantis is live and manages all future deployments.
#
# Run order:
#   1. Shared Infrastructure (VPC, ECS cluster, SGs)
#   2. Atlantis service (into the shared ECS cluster)
#   3. AX Ripple Network service (validators, API nodes, HAProxy)
#
# Prerequisites (manual, before first run):
#   1. AWS IAM OIDC provider for GitHub Actions
#   2. IAM role with trust policy for this repo (stored as GitHub org secret AWS_ROLE_ARN)
#   3. S3 bucket + DynamoDB table for Terraform state (or let step 1 create them)
#   4. Secrets Manager entries: atlantis/github-token, atlantis/webhook-secret
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
      deploy_ripple_network:
        description: "Also deploy AX Ripple Network service?"
        required: true
        default: true
        type: boolean

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.5.0"

jobs:
  # ===========================================================================
  # Step 1 — Shared Infrastructure
  # ===========================================================================
  shared-infra:
    name: "1. Deploy Shared Infrastructure"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 004_terraform/shared-infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Output Summary
        run: |
          echo "## ✅ Shared Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| VPC ID | $(terraform output -raw vpc_id) |" >> $GITHUB_STEP_SUMMARY
          echo "| ECS Cluster | $(terraform output -raw ecs_cluster_name) |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Step 2 — Atlantis Service (so it can manage future deployments)
  # ===========================================================================
  atlantis:
    name: "2. Deploy Atlantis"
    needs: shared-infra
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 004_terraform/services/atlantis
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Output Summary
        run: |
          echo "## ✅ Atlantis Deployed" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | $(terraform output -raw atlantis_service_name) |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | $(terraform output -raw atlantis_url) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Atlantis is now live. All future infra changes should be done via PRs." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Step 3 — AX Ripple Network Service (optional, can also be done via Atlantis)
  # ===========================================================================
  ripple-network:
    name: "3. Deploy AX Ripple Network"
    needs: [shared-infra, atlantis]
    if: inputs.deploy_ripple_network
    runs-on: ubuntu-latest
    outputs:
      haproxy_public_ip: ${{ steps.tf-outputs.outputs.haproxy_public_ip }}
    defaults:
      run:
        working-directory: 004_terraform/services/ax-ripple-network
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -----------------------------------------------------------------------
      # Build & push Docker images BEFORE Terraform apply
      # ECS tasks need images to exist in ECR when services are created.
      # On first bootstrap, ECR repos may not exist yet — create them first.
      # -----------------------------------------------------------------------
      - name: Ensure ECR repositories exist
        run: |
          for repo in ax-ripple-${{ inputs.environment }}/validator ax-ripple-${{ inputs.environment }}/api-node; do
            aws ecr describe-repositories --repository-names "$repo" 2>/dev/null || \
            aws ecr create-repository --repository-name "$repo" --image-tag-mutability MUTABLE --image-scanning-configuration scanOnPush=true
          done

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push Validator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: 001_app/docker/Dockerfile.validator
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/ax-ripple-${{ inputs.environment }}/validator:latest
            ${{ steps.ecr-login.outputs.registry }}/ax-ripple-${{ inputs.environment }}/validator:r-1.0.0
          cache-from: type=gha,scope=validator
          cache-to: type=gha,mode=max,scope=validator

      - name: Build & push API Node image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: 001_app/docker/Dockerfile.api-node
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/ax-ripple-${{ inputs.environment }}/api-node:latest
            ${{ steps.ecr-login.outputs.registry }}/ax-ripple-${{ inputs.environment }}/api-node:r-1.0.0
          cache-from: type=gha,scope=api-node
          cache-to: type=gha,mode=max,scope=api-node

      - name: Confirm images in ECR
        run: |
          echo "✅ ECR images pushed:"
          aws ecr list-images --repository-name ax-ripple-${{ inputs.environment }}/validator --query 'imageIds[*].imageTag' --output table
          aws ecr list-images --repository-name ax-ripple-${{ inputs.environment }}/api-node --query 'imageIds[*].imageTag' --output table

      # -----------------------------------------------------------------------
      # Terraform — deploy ECS services, HAProxy, observability
      # -----------------------------------------------------------------------
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ inputs.environment }}.tfvars -out=tfplan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false tfplan

      - name: Capture Terraform outputs
        id: tf-outputs
        run: |
          HAPROXY_IP=$(terraform output -raw haproxy_public_ip)
          echo "haproxy_public_ip=${HAPROXY_IP}" >> "$GITHUB_OUTPUT"
          echo "HAProxy public IP: ${HAPROXY_IP}"

      - name: Output Summary
        run: |
          echo "## ✅ AX Ripple Network Deployed" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| HAProxy HTTP | $(terraform output -raw haproxy_http_endpoint) |" >> $GITHUB_STEP_SUMMARY
          echo "| HAProxy WS   | $(terraform output -raw haproxy_ws_endpoint) |" >> $GITHUB_STEP_SUMMARY
          echo "| HAProxy IP   | $(terraform output -raw haproxy_public_ip) |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana      | http://$(terraform output -raw haproxy_public_ip):3000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Prometheus   | http://$(terraform output -raw haproxy_public_ip):9090 |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Step 4 — Post-Deploy Configuration
  # Runs after ripple-network apply. Idempotent — safe to re-run anytime.
  #   1. update-task-definitions.sh  — wires full Secrets Manager ARNs into ECS tasks
  #   2. Waits for Prometheus + Grafana ECS services to be stable
  #   3. provision-grafana-dashboard.sh — upserts Prometheus datasource + dashboard
  #
  # HAProxy public IP is read from Terraform output (not hardcoded) so it
  # survives re-deploys where the EIP may be re-allocated.
  # ===========================================================================
  post-deploy:
    name: "4. Post-Deploy Configuration"
    needs: ripple-network
    if: inputs.deploy_ripple_network
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CLUSTER: ax-ripple-${{ inputs.environment }}
      HAPROXY_IP: ${{ needs.ripple-network.outputs.haproxy_public_ip }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Make scripts executable
        run: chmod +x 003_scripts/*.sh

      - name: Update ECS task definitions (resolve full secret ARNs)
        run: ./003_scripts/update-task-definitions.sh ${{ env.ENVIRONMENT }}

      - name: Wait for Prometheus service to be stable
        run: |
          echo "Waiting for ax-ripple-${{ env.ENVIRONMENT }}-prometheus to stabilise..."
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services ax-ripple-${{ env.ENVIRONMENT }}-prometheus \
            --region ${{ env.AWS_REGION }} || true
          echo "Prometheus service stable."

      - name: Wait for Grafana service to be stable
        run: |
          echo "Waiting for ax-ripple-${{ env.ENVIRONMENT }}-grafana to stabilise..."
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services ax-ripple-${{ env.ENVIRONMENT }}-grafana \
            --region ${{ env.AWS_REGION }} || true
          echo "Grafana service stable."

      - name: Provision Grafana datasource and dashboard
        env:
          GRAFANA_URL: "http://${{ env.HAPROXY_IP }}:3000"
          GRAFANA_USER: admin
          GRAFANA_PASSWORD: admin
          PROMETHEUS_INTERNAL: "http://prometheus.${{ env.ENVIRONMENT }}.local:9090"
          HAPROXY_IP: ${{ env.HAPROXY_IP }}
        run: ./003_scripts/provision-grafana-dashboard.sh

      - name: Summary
        run: |
          echo "## ✅ Post-Deploy Configuration Applied" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Task Definitions Updated | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana Dashboard Provisioned | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Grafana URL** | http://${{ env.HAPROXY_IP }}:3000/d/ax-ripple-network |" >> $GITHUB_STEP_SUMMARY
          echo "| **Prometheus URL** | http://${{ env.HAPROXY_IP }}:9090 |" >> $GITHUB_STEP_SUMMARY

