  #   apply_requirements:
  #     - approved
  #     - mergeable
  #   workflow: prod-service

# =============================================================================
# Workflows — one per environment × module type
# =============================================================================
workflows:
  # ---------------------------------------------------------------------------
  # DEV workflows
  # ---------------------------------------------------------------------------
  dev-shared-infra:
    plan:
      steps:
        - init:
            extra_args: ["-upgrade"]
        - plan:
            extra_args: ["-var-file=environments/dev.tfvars"]
    apply:
      steps:
        - apply

  dev-service:
    plan:
      steps:
        - init:
            extra_args: ["-upgrade"]
        - plan:
            extra_args: ["-var-file=environments/dev.tfvars"]
    apply:
      steps:
        - apply

