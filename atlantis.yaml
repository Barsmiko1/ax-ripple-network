version: 3
automerge: false
parallel_plan: true
parallel_apply: false

# =============================================================================
# Atlantis PR-Driven Terraform Workflow — Multi-Environment Architecture
# =============================================================================
#
# Three independent Terraform root modules, each with its own state:
#
#   1. shared-infra         → VPC, ECS cluster, SGs, service discovery
#   2. ax-ripple-network    → Rippled validators, API nodes, HAProxy, observability
#   3. atlantis             → Atlantis server running on the shared ECS cluster
#
# Each module supports multiple environments (dev, prod) via:
#   - Separate Atlantis projects per environment
#   - Terraform workspaces to isolate state (env:/<workspace>/key)
#   - Environment-specific tfvars files
#
# Atlantis autoplan:
#   - Detects which files changed and runs plan for ALL environments
#     that share those files (e.g. changing main.tf plans both dev AND prod)
#   - Changing only environments/dev.tfvars plans dev only
#   - Changing only environments/prod.tfvars plans prod only
#
# Deployment order:
#   shared-infra MUST be applied before any service.
#   Services can be applied independently of each other.
#
# Commands:
#   atlantis plan -p shared-infra-dev          # plan dev shared-infra
#   atlantis plan -p shared-infra-prod         # plan prod shared-infra
#   atlantis apply -p ax-ripple-network-dev    # apply dev ripple network
#   atlantis apply -p ax-ripple-network-prod   # apply prod ripple network
# =============================================================================

projects:
  # ===========================================================================
  # DEV Environment
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Shared Infrastructure — DEV
  # ---------------------------------------------------------------------------
  - name: shared-infra-dev
    dir: 004_terraform/shared-infra
    workspace: dev
    terraform_version: v1.5.0
    autoplan:
      when_modified:
        - "**/*.tf"
        - "environments/dev.tfvars"
        - "cfn/**/*.yaml"
      enabled: true
    apply_requirements:
      - approved
      - mergeable
    workflow: dev-shared-infra

  # ---------------------------------------------------------------------------
  # AX Ripple Network Service — DEV
  # ---------------------------------------------------------------------------
  - name: ax-ripple-network-dev
    dir: 004_terraform/services/ax-ripple-network
    workspace: dev
    terraform_version: v1.5.0
    autoplan:
      when_modified:
        - "**/*.tf"
        - "environments/dev.tfvars"
        - "cfn/**/*.yaml"
      enabled: true
    apply_requirements:
      - approved
      - mergeable
    workflow: dev-service

  # ---------------------------------------------------------------------------
  # Atlantis Service — DEV
  # ---------------------------------------------------------------------------
  - name: atlantis-dev
    dir: 004_terraform/services/atlantis
    workspace: dev
    terraform_version: v1.5.0
    autoplan:
      when_modified:
        - "**/*.tf"
        - "environments/dev.tfvars"
        - "cfn/**/*.yaml"
      enabled: true
    apply_requirements:
      - approved
      - mergeable
    workflow: dev-service

  # ===========================================================================
  # PROD Environment (uncomment when ready to deploy prod)
  # ===========================================================================

  # # -------------------------------------------------------------------------
  # # Shared Infrastructure — PROD
  # # -------------------------------------------------------------------------
  # - name: shared-infra-prod
  #   dir: 004_terraform/shared-infra
  #   workspace: prod
  #   terraform_version: v1.5.0
  #   autoplan:
  #     when_modified:
  #       - "**/*.tf"
  #       - "environments/prod.tfvars"
  #       - "cfn/**/*.yaml"
  #     enabled: true
  #   apply_requirements:
  #     - approved
  #     - mergeable
  #   workflow: prod-shared-infra

  # # -------------------------------------------------------------------------
  # # AX Ripple Network Service — PROD
  # # -------------------------------------------------------------------------
  # - name: ax-ripple-network-prod
  #   dir: 004_terraform/services/ax-ripple-network
  #   workspace: prod
  #   terraform_version: v1.5.0
  #   autoplan:
  #     when_modified:
  #       - "**/*.tf"
  #       - "environments/prod.tfvars"
  #       - "cfn/**/*.yaml"
  #     enabled: true
  #   apply_requirements:
  #     - approved
  #     - mergeable
  #   workflow: prod-service

  # # -------------------------------------------------------------------------
  # # Atlantis Service — PROD
  # # -------------------------------------------------------------------------
  # - name: atlantis-prod
  #   dir: 004_terraform/services/atlantis
  #   workspace: prod
  #   terraform_version: v1.5.0
  #   autoplan:
  #     when_modified:
  #       - "**/*.tf"
