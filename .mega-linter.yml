---
# MegaLinter Configuration
# https://megalinter.io
APPLY_FIXES: all
ENABLE_LINTERS:
  - CLOUDFORMATION_CFN_LINT
  - YAML_YAMLLINT
  - JAVASCRIPT_ES
  - BASH_SHELLCHECK
  - MARKDOWN_MARKDOWNLINT
  - JSON_JSONLINT
  - DOCKERFILE_HADOLINT
DISABLE_LINTERS:
  - COPYPASTE_JSCPD
  - SPELL_CSPELL
  - SPELL_MISSPELL
  - TERRAFORM_TERRASCAN
  - TERRAFORM_TFLINT
  - TERRAFORM_TERRAFORM_VALIDATE
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
PRINT_ALL_FILES: false
JAVASCRIPT_ES_CONFIG_FILE: .eslintrc.json
CLOUDFORMATION_CFN_LINT_ARGUMENTS: >-
  --ignore-checks W2001 W2506 I3011 I3042
CLOUDFORMATION_CFN_LINT_FILTER_REGEX_EXCLUDE: '(\.cfnlintrc)'
FILTER_REGEX_EXCLUDE: '(node_modules|\.terraform|\.git)'
