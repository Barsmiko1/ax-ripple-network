AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Atlantis Service — ECS Task, Service, IAM, Logs
  Deploys Atlantis into the shared ECS cluster for PR-driven Terraform automation.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  # Public subnets — Atlantis must be publicly reachable for GitHub webhooks
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: Public subnet IDs for Atlantis (must be publicly routable for GitHub webhooks)
  # Private subnets kept for service discovery registration only
  PrivateSubnetIds:
    Type: CommaDelimitedList
  AtlantisSGId:
    Type: String
  ECSClusterArn:
    Type: String
    Description: Shared ECS Cluster ARN
  ECSTaskExecutionRoleArn:
    Type: String
    Description: Shared ECS Task Execution Role ARN
  ServiceDiscoveryNamespaceId:
    Type: String
    Description: Shared Service Discovery namespace ID
  AtlantisImage:
    Type: String
    Default: "ghcr.io/runatlantis/atlantis:v0.28.0"
  GitHubTokenSecretArn:
    Type: String
    Description: Secrets Manager ARN for GitHub token
  GitHubWebhookSecretArn:
    Type: String
    Description: Secrets Manager ARN for GitHub webhook secret
  AtlantisRepoAllowlist:
    Type: String
    Description: Repos Atlantis is allowed to manage
  GitHubUser:
    Type: String
    Description: GitHub username or bot account for Atlantis to comment on PRs
  # The public URL GitHub uses to deliver webhooks and where Atlantis posts PR comments.
  # Must be externally reachable. Format: http://<public-ip-or-dns>:4141
  AtlantisBaseUrl:
    Type: String
    Description: >-
      Publicly reachable URL for Atlantis (used as ATLANTIS_ATLANTIS_URL).
      Derived from the Elastic IP allocated in the shared-infra network stack.
      Format: http://<eip-public-ip>:4141
  # Allocation ID of the Elastic IP from the shared-infra network stack.
  # The Atlantis container associates this EIP to its own ENI on startup,
  # ensuring the same public IP is reused across task restarts.
  AtlantisEIPAllocationId:
    Type: String
    Description: EIP Allocation ID from shared-infra (e.g. eipalloc-xxxxxxxxx)
  TaskCpu:
    Type: String
    Default: "512"
  TaskMemory:
    Type: String
    Default: "1024"

Resources:
  # ===========================================================================
  # CloudWatch Log Group
  # ===========================================================================
  AtlantisLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/ax-ripple-${Environment}/atlantis"
      RetentionInDays: 30

  # ===========================================================================
  # Service Discovery
  # ===========================================================================
  AtlantisServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: atlantis
      NamespaceId: !Ref ServiceDiscoveryNamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ===========================================================================
  # IAM — Atlantis Task Role (needs Terraform + CFN + state access)
  # ===========================================================================
  AtlantisTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ax-ripple-${Environment}-atlantis-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AtlantisTerraformPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Terraform state access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - "arn:aws:s3:::ax-ripple-network-terraform-state"
                  - "arn:aws:s3:::ax-ripple-network-terraform-state/*"
              # DynamoDB state locking
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ax-ripple-network-terraform-locks"
              # CloudFormation (Terraform provisions CFN stacks)
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ax-ripple-*"
              # EC2, ECS, IAM, ECR, etc. for CFN stack resources
              - Effect: Allow
                Action:
                  - ec2:*
                  - ecs:*
                  - ecr:*
                  - iam:*
                  - logs:*
                  - elasticfilesystem:*
                  - servicediscovery:*
                  - autoscaling:*
                  - ssm:GetParameter*
                  - secretsmanager:GetSecretValue
                Resource: "*"
              # EIP self-association — allows the Atlantis task to attach the
              # shared-infra Elastic IP to its own ENI on startup so the public
              # IP is stable across task restarts.
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeAddresses
                Resource: "*"

  # ===========================================================================
  # ECS Task Definition
  # ===========================================================================
  AtlantisTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ax-ripple-${Environment}-atlantis"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !GetAtt AtlantisTaskRole.Arn
      ContainerDefinitions:
        # -----------------------------------------------------------------------
        # Init container — associates the shared-infra Elastic IP to this
        # task's ENI before Atlantis starts. Runs once and exits (essential: false).
        # This ensures the same public IP is used regardless of task restarts.
        # -----------------------------------------------------------------------
        - Name: eip-associate
          Image: amazon/aws-cli:latest
          Essential: false
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AtlantisLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: eip-associate
          Environment:
            - Name: EIP_ALLOCATION_ID
              Value: !Ref AtlantisEIPAllocationId
            - Name: AWS_DEFAULT_REGION
              Value: !Ref "AWS::Region"
          Command:
            - "/bin/sh"
            - "-c"
            - |
              TOKEN=$(curl -sf -X PUT "http://169.254.170.2/v4/$(curl -sf http://169.254.170.2/v4)" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" 2>/dev/null || true)
              MAC=$(curl -sf http://169.254.169.254/latest/meta-data/network/interfaces/macs/ | head -1 | tr -d '/')
              ENI_ID=$(curl -sf "http://169.254.169.254/latest/meta-data/network/interfaces/macs/${MAC}/interface-id")
              echo "[eip-associate] Associating EIP ${EIP_ALLOCATION_ID} to ENI ${ENI_ID}"
              aws ec2 associate-address \
                --allocation-id "${EIP_ALLOCATION_ID}" \
                --network-interface-id "${ENI_ID}" \
                --allow-reassociation
              echo "[eip-associate] Done"

        # -----------------------------------------------------------------------
        # Atlantis server
        # -----------------------------------------------------------------------
        - Name: atlantis
          Image: !Ref AtlantisImage
          Essential: true
          DependsOn:
            - ContainerName: eip-associate
              Condition: SUCCESS
          PortMappings:
            - ContainerPort: 4141
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AtlantisLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: atlantis
          HealthCheck:
            Command: ["CMD-SHELL", "curl -sf http://localhost:4141/healthz || exit 1"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - Name: ATLANTIS_PORT
              Value: "4141"
            - Name: ATLANTIS_GH_USER
              Value: !Ref GitHubUser
            - Name: ATLANTIS_REPO_ALLOWLIST
              Value: !Ref AtlantisRepoAllowlist
            # ATLANTIS_ATLANTIS_URL must be the public URL GitHub sends webhooks to.
            # Derived from the Elastic IP — stable across task restarts.
            - Name: ATLANTIS_ATLANTIS_URL
              Value: !Ref AtlantisBaseUrl
            - Name: ATLANTIS_REPO_CONFIG_JSON
              Value: '{"repos":[{"id":"/.*/","allowed_overrides":["workflow","apply_requirements"],"allow_custom_workflows":true}]}'
          Secrets:
            - Name: ATLANTIS_GH_TOKEN
              ValueFrom: !Ref GitHubTokenSecretArn
            - Name: ATLANTIS_GH_WEBHOOK_SECRET
              ValueFrom: !Ref GitHubWebhookSecretArn

  # ===========================================================================
  # ECS Service
  # Atlantis MUST run in a public subnet with a public IP so that GitHub can
  # deliver webhook events. Private subnet + NAT does not work for inbound
  # connections from GitHub's webhook IPs.
  # ===========================================================================
  AtlantisService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "ax-ripple-${Environment}-atlantis"
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref AtlantisTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref AtlantisSGId
      ServiceRegistries:
        - RegistryArn: !GetAtt AtlantisServiceDiscovery.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      EnableExecuteCommand: true

Outputs:
  AtlantisServiceName:
    Description: Atlantis ECS Service Name
    Value: !GetAtt AtlantisService.Name
    Export:
      Name: !Sub "${AWS::StackName}-AtlantisServiceName"

  AtlantisURL:
    Description: Atlantis public webhook/UI endpoint (set as GitHub webhook URL)
    Value: !Ref AtlantisBaseUrl
    Export:
      Name: !Sub "${AWS::StackName}-AtlantisURL"

  AtlantisWebhookURL:
    Description: Full webhook path to register in GitHub repository settings
    Value: !Sub "${AtlantisBaseUrl}/events"
    Export:
      Name: !Sub "${AWS::StackName}-AtlantisWebhookURL"
