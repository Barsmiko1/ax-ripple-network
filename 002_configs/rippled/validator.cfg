# =============================================================================
# Rippled Validator Node Configuration
# Private network — DO NOT expose publicly
# Based on: https://xrpl.org/docs/infrastructure/testing-and-auditing/run-private-network-with-docker
# =============================================================================

[server]
port_rpc_admin_local
port_peer
port_ws_admin_local

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_ws_admin_local]
port = 6006
ip = 127.0.0.1
admin = 127.0.0.1
protocol = ws

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
small

[node_db]
type=NuDB
path=/var/lib/rippled/db/nudb
advisory_delete=0
online_delete=256

[ledger_history]
256

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[sntp_servers]
time.windows.com
time.apple.com
time.nist.gov
pool.ntp.org

[validators_file]
validators.txt

# VALIDATOR_TOKEN injected at startup by entrypoint from Secrets Manager
[validator_token]
PLACEHOLDER_INJECT_AT_DEPLOY


# Private network — no ssl verification needed
[ssl_verify]
0

[amendment_majority_time]
15 minutes

[log_level]
warning
