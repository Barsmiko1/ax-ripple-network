# Ripple Validator Node Configuration
# This node participates in consensus - DO NOT expose publicly.

[server]
port_peer
port_rpc_admin

[port_peer]
ip=0.0.0.0
port=51235
protocol=peer

[port_rpc_admin]
ip=127.0.0.1
port=5005
protocol=http
admin=127.0.0.1

[node_size]
medium

[node_db]
type=NuDB
path=/var/lib/rippled/db/nudb
advisory_delete=0
online_delete=512
earliest_seq=1

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[sntp_servers]
time.windows.com
time.apple.com
time.nist.gov
pool.ntp.org

[validators_file]
validators.txt

# IMPORTANT: Inject via AWS Secrets Manager at deploy time
# Do NOT commit actual seed values
[validation_seed]
PLACEHOLDER_INJECT_AT_DEPLOY

[peer_private]
1

[ledger_history]
256

[fetch_depth]
full

[validation_quorum]
3

[ssl_verify]
1

[amendment_majority_time]
5 minutes

# Private network isolation — prevents connecting to mainnet
# Value is injected dynamically by entrypoint script via NETWORK_ID env var
# Default: 10000 (custom private network)

[log_level]
warning

[insight]
server=statsd
address=127.0.0.1:8125
prefix=rippled.validator

