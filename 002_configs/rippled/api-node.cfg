# Ripple API (Stock) Node Configuration
# This node serves public HTTP + WebSocket requests via HAProxy.

[server]
port_peer
port_rpc
port_ws_public

[port_peer]
ip=0.0.0.0
port=51235
protocol=peer

[port_rpc]
ip=0.0.0.0
port=5005
protocol=http
admin=127.0.0.1

[port_ws_public]
ip=0.0.0.0
port=6006
protocol=ws

[node_size]
medium

[node_db]
type=RocksDB
path=/var/lib/rippled/db/rocksdb
open_files=2000
filter_bits=12
cache_mb=256
file_size_mb=8
file_size_mult=2
advisory_delete=0
online_delete=512
earliest_seq=1

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[sntp_servers]
time.windows.com
time.apple.com
time.nist.gov
pool.ntp.org

[validators_file]
validators.txt

# No validation_seed — this node does NOT validate
[peer_private]
0

[ledger_history]
full

[fetch_depth]
full

[ssl_verify]
1

# Private network isolation — prevents connecting to mainnet
# Value is injected dynamically by entrypoint script via NETWORK_ID env var
# Default: 10000 (custom private network)

[log_level]
warning

[insight]
server=statsd
address=127.0.0.1:8125
prefix=rippled.api

