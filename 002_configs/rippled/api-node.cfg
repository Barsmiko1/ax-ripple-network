# =============================================================================
# Rippled API Node Configuration
# Serves HTTP + WebSocket to HAProxy — public facing via proxy
# Based on: https://xrpl.org/docs/infrastructure/testing-and-auditing/run-private-network-with-docker
# =============================================================================

[server]
port_rpc_admin_local
port_rpc_public
port_ws_public
port_peer

[port_rpc_admin_local]
port = 5005
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

# Public HTTP JSON-RPC — used by HAProxy backend
[port_rpc_public]
port = 51234
ip = 0.0.0.0
protocol = http

# Public WebSocket — used by HAProxy backend
[port_ws_public]
port = 6006
ip = 0.0.0.0
protocol = ws

[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[node_size]
small

[node_db]
type=NuDB
path=/var/lib/rippled/db/nudb
advisory_delete=0
online_delete=256

[ledger_history]
256

[database_path]
/var/lib/rippled/db

[debug_logfile]
/var/log/rippled/debug.log

[sntp_servers]
time.windows.com
time.apple.com
time.nist.gov
pool.ntp.org

[validators_file]
validators.txt

# No validation_seed — API nodes do NOT validate
[peer_private]
0

# Private network — no ssl verification needed
[ssl_verify]
0

[log_level]
warning
