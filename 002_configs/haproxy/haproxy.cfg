# =============================================================================
# HAProxy Configuration for AX Ripple Network
# Routes HTTP (JSON-RPC) and WebSocket traffic to rippled API nodes
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  3600s
    retries 3
    option  redispatch

# =============================================================================
# Stats Frontend — Monitoring endpoint
# =============================================================================
frontend stats_front
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats admin if TRUE

# =============================================================================
# HTTP Frontend — JSON-RPC traffic (port 80 → rippled port 5005)
# =============================================================================
frontend http_front
    bind *:80
    default_backend rippled_http
    log-format "%ci:%cp [%tr] %ft %b/%s %Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"

# =============================================================================
# WebSocket Frontend — WS traffic (port 6006 → rippled port 6006)
# =============================================================================
frontend ws_front
    bind *:6006
    default_backend rippled_ws
    log-format "%ci:%cp [%tr] %ft %b/%s %Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"

# =============================================================================
# HTTP Backend — rippled JSON-RPC nodes
# =============================================================================
backend rippled_http
    balance roundrobin
    option httpchk POST / HTTP/1.1\r\nContent-Type:\ application/json\r\nContent-Length:\ 41\r\n\r\n{\"method\":\"server_info\",\"params\":[{}]}
    http-check expect status 200

    # In ECS: resolved via service discovery DNS (ripple-api.<env>.local)
    # For local/Docker Compose testing, replace with container names or IPs
    server-template api- 2 ripple-api.dev.local:5005 check resolvers dns inter 5s fall 3 rise 2

# =============================================================================
# WebSocket Backend — rippled WebSocket nodes
# =============================================================================
backend rippled_ws
    balance roundrobin
    option httpchk POST / HTTP/1.1\r\nContent-Type:\ application/json\r\nContent-Length:\ 41\r\n\r\n{\"method\":\"server_info\",\"params\":[{}]}
    http-check expect status 200

    # Sticky sessions for WebSocket — route same client to same backend
    stick-table type ip size 100k expire 30m
    stick on src

    # In ECS: resolved via service discovery DNS
    server-template api- 2 ripple-api.dev.local:6006 check resolvers dns inter 5s fall 3 rise 2

# =============================================================================
# DNS Resolvers — for ECS service discovery
# =============================================================================
resolvers dns
    nameserver vpc 169.254.169.253:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    accepted_payload_size 8192

