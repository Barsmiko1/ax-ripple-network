# =============================================================================
# HAProxy Configuration for AX Ripple Network
# Routes HTTP (JSON-RPC) and WebSocket traffic to rippled API nodes
# =============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    daemon
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout tunnel  3600s
    retries 3
    option  redispatch

# =============================================================================
# Stats Frontend — Monitoring endpoint
# =============================================================================
frontend stats_front
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats admin if TRUE

# =============================================================================
# HTTP Frontend — JSON-RPC traffic (port 80 → rippled port 5005)
# =============================================================================
frontend http_front
    bind *:80
    default_backend rippled_http
    log-format "%ci:%cp [%tr] %ft %b/%s %Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"

# =============================================================================
# WebSocket Frontend — WS traffic (port 6006 → rippled port 6006)
# =============================================================================
frontend ws_front
    bind *:6006
    default_backend rippled_ws
    log-format "%ci:%cp [%tr] %ft %b/%s %Tw/%Tc/%Tr/%Ta %ST %B %tsc %ac/%fc/%bc/%sc %sq/%bq %hr %hs %{+Q}r"

# =============================================================================
# HTTP Backend — rippled JSON-RPC nodes
# =============================================================================
backend rippled_http
    balance roundrobin
    option httpchk
    http-check send meth POST uri / ver HTTP/1.1 hdr Content-Type application/json hdr Content-Length 41 body "{\"method\":\"server_info\",\"params\":[{}]}"
    http-check expect status 200
    # rippled public HTTP JSON-RPC listens on 51234 (NOT 5005 — that is admin-only/127.0.0.1)
    server-template api- 2 ripple-api.dev.local:51234 check resolvers dns inter 5s fall 3 rise 2

# =============================================================================
# WebSocket Backend — rippled WebSocket nodes
# =============================================================================
backend rippled_ws
    balance roundrobin
    # Use TCP health check — rippled WS port (6006) rejects plain HTTP POST with
    # "Forbidden". TCP check just verifies the port is open and accepting conns.
    option tcp-check
    tcp-check connect port 6006
    # Sticky sessions for WebSocket — route same client to same backend
    stick-table type ip size 100k expire 30m
    stick on src

    # rippled public WebSocket listens on 6006
    server-template api- 2 ripple-api.dev.local:6006 check resolvers dns inter 5s fall 3 rise 2

# =============================================================================
# Grafana Frontend — expose Grafana UI publicly on port 3000
# =============================================================================
frontend grafana_front
    bind *:3000
    default_backend grafana_backend

backend grafana_backend
    balance roundrobin
    server-template grafana- 1 grafana.dev.local:3000 check resolvers dns inter 10s fall 3 rise 2

# =============================================================================
# Prometheus Frontend — expose Prometheus UI publicly on port 9090
# =============================================================================
frontend prometheus_front
    bind *:9090
    default_backend prometheus_backend

backend prometheus_backend
    balance roundrobin
    server-template prometheus- 1 prometheus.dev.local:9090 check resolvers dns inter 10s fall 3 rise 2

# =============================================================================
# DNS Resolvers — for ECS service discovery
# =============================================================================
resolvers dns
    nameserver vpc 169.254.169.253:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      10s
    accepted_payload_size 8192

